[project]
name = "caissa-backend"
version = "0.1.0"
description = "Caissa chess analytics API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-chess>=1.11",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.7",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
